<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists Example</title>
</head>
<body>

    <h2>1. Ordered List</h2>
   
    <ol>
        <li>Step One: Open the file</li>
        <li>Step Two: Write the code</li>
        <li>Step Three: Save the file</li>
    </ol>

    <h2>  2. Unordered List  </h2>
    
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
    </ul>
    <h2> 3. Description List </h2>
    <dl>
        <dt><b>HTML</b></dt>
        <dd>I am now learning HTML.</dd>
        
        <dt><b>CSS</b></dt>
        <dd>I am learning CSS too.</dd>
    </dl>

</body>
</html>
