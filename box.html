<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model & Corner to Corner Layout</title>
    <style>
        
        .container {
            display: grid;
            grid-template-columns: 250px 250px; 
            grid-template-rows: 250px 250px 250px;
            gap: 0;
            margin: 50px;
        }
        .box {
            box-sizing: border-box; 
            width: 100%;
            height: 100%;
        }

        
        
        .box1 {
            background-color: #63b5b7; 
            border: 15px solid black; 
            padding: 20px; 
            grid-column: 1; 
            grid-row: 1;    
            font-family: serif;
            font-size: 15px;
        }

        .box2 {
            background-color: #ffd700;
          
            border-top: 20px solid black;
            border-bottom: 20px solid black;
            border-right: 10px solid black;
            border-left: 10px solid black;
            grid-column: 2; 
            grid-row: 2;    
        }
        .box3 {
            background-color: #cd5c5c; 
            border: 15px solid black;
            grid-column: 1;
            grid-row: 3;    
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box box1">first box</div>
        <div class="box box2"> second box</div>
        <div class="box box3">third box</div>
    </div>

</body>
</html>
