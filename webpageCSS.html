<!DOCTYPE html>
<html>
<head>
    <title>CSS Background and Fonts</title>
    
   
    <style>
        
        body {
            background-image: url('page-bg.jpg'); 
            background-size: cover; 
            font-family: Arial, sans-serif;
            color: rgb(2, 2, 2); 
        }

       
        .heading-style {
            font-family: 'Courier New', Courier, monospace;
            color: yellow; 
            text-align: center;
        }

        
        .special-box {
            background-image: url('box-bg.jpg'); 
            background-size: cover;
            border: 3px solid white;
            padding: 30px;
            margin: 20px;
            font-style: italic;
            color: rgb(7, 223, 7); 
            font-size: 20px;
        }
    </style>
</head>
<body>

    
    
    
    <h1 class="heading-style">Welcome to My CSS Webpage</h1>

    
    <div class="special-box">
        <h2>This is a Single Element</h2>
        <p>Colorgreen , Font style italic.</p>
    </div>

</body>
</html>
